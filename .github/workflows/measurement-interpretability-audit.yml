name: DuraMAT Measurement Interpretability Audit

on:
  push:
    paths:
      - 'analysis/audit_measurement_interpretability.py'
      - '.github/workflows/measurement-interpretability-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Download public DuraMAT BEST source
        run: python external_data/download_duramat_best.py
      - name: Verify locked source hash
        shell: bash
        run: |
          expected='e6e88f3948008fd2ac6bdf52007b7cee16ee334f78db07c633826188fe4e8713'
          actual="$(sha256sum 2019-2024-iv-curves-blind.csv | awk '{print $1}')"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"
      - name: Run measurement audit
        run: python analysis/audit_measurement_interpretability.py --input 2019-2024-iv-curves-blind.csv
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: duramat-measurement-interpretability-audit
          path: results/duramat_best/measurement_audit/
          if-no-files-found: error
          retention-days: 30
